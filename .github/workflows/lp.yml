name: LP forward test

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 min (GitHub a veces se retrasa unos minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lp-forward-test
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Lectura on-chain
        run: python3 lp_forward_test.py --once

      - name: Guardar datos
        run: |
          git config user.name "lp-bot"
          git config user.email "lp-bot@users.noreply.github.com"
          git add -A lp_forward_data README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Lectura $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git push -q && exit 0
            git pull -q --rebase -X theirs
          done
          exit 1
